<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>pomoted · lofi pomodoro timer</title>
<meta name="description" content="A calm, lofi pomodoro timer with animated scenes. Works on any device, no sign-in." />
<meta name="theme-color" id="metaTheme" content="#241a2e" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%23ffc078' stroke-width='10'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-scene="catstudy">

  <!-- living background: photo stage / canvas / clouds / vignette -->
  <div class="bg" aria-hidden="true">
    <div class="photo-stage" id="photoStage">
      <img class="stage-blur" id="stageBlur" alt="" aria-hidden="true" />
      <img class="stage-img" id="stageImg" alt="" aria-hidden="true" />
    </div>
    <canvas id="sceneCanvas"></canvas>
    <div class="clouds">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
    </div>
    <div class="vignette"></div>
  </div>

  <!-- ================= SETUP: seamless floating options ================= -->
  <main id="setup" class="screen">

    <header class="head">
      <h1 class="brand">pomoted</h1>
        <p class="tagline">let's bombclaat study</p>
    </header>

    <section class="float-panel timing">
      <div class="presets">
        <button type="button" class="preset" data-f="25" data-s="5"  data-l="15" data-n="4">classic · 25/5</button>
        <button type="button" class="preset" data-f="50" data-s="10" data-l="30" data-n="3">deep work · 50/10</button>
        <button type="button" class="preset" data-f="15" data-s="3"  data-l="12" data-n="6">sprint · 15/3</button>
      </div>

      <div class="sliders">
        <div class="slider-block">
          <div class="slider-head">
            <label for="focus">Focus</label>
            <output id="focusVal">25 min</output>
          </div>
          <input type="range" id="focus" min="5" max="90" step="5" value="25" />
          <div class="ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </div>

        <div class="slider-block">
          <div class="slider-head">
            <label for="short">Short break</label>
            <output id="shortVal">5 min</output>
          </div>
          <input type="range" id="short" min="1" max="30" step="1" value="5" />
          <div class="ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </div>

        <div class="slider-block">
          <div class="slider-head">
            <label for="long">Long break</label>
            <output id="longVal">15 min</output>
          </div>
          <input type="range" id="long" min="5" max="60" step="5" value="15" />
          <div class="ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </div>

        <div class="slider-block">
          <div class="slider-head">
            <label for="sessions">Long break every</label>
            <output id="sessionsVal">4 sessions</output>
          </div>
          <input type="range" id="sessions" min="2" max="8" step="1" value="4" />
          <div class="ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
    </section>

    <section class="showcase-sec">
      <div class="showcase">
        <button type="button" class="arrow arrow-left" id="prevScene" aria-label="Previous theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="carousel3d" id="carousel"></div>
        <button type="button" class="arrow arrow-right" id="nextScene" aria-label="Next theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4.5 16 12l-7.5 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="scroll-track" id="scrollTrack">
        <div class="scroll-thumb" id="scrollThumb"></div>
      </div>
    </section>

    <div class="bottom-bar">
      <label class="toggle">
        <input type="checkbox" id="sound" checked />
        <span class="track" aria-hidden="true"></span>
        <span class="toggle-text">chime</span>
      </label>
      <button id="start" class="start-btn" type="button">
        <span>Begin session</span>
        <span class="arrow-ico" aria-hidden="true">&rarr;</span>
      </button>
      <p class="hint">open on your phone &amp; &ldquo;Add to Home Screen&rdquo;</p>
    </div>

  </main>

  <!-- ================= SESSION ================= -->
  <main id="session" class="screen hidden">
    <div class="halo" aria-hidden="true"></div>

    <div class="timer-wrap">
      <div class="brand-mini">pomoted</div>
      <div class="phase-label" id="phaseLabel">Focus</div>

      <div class="ring">
        <svg viewBox="0 0 300 300" aria-hidden="true">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" class="grad-a" />
              <stop offset="100%" class="grad-b" />
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="150" cy="150" r="140"></circle>
          <circle class="ring-fg" id="ringFg" cx="150" cy="150" r="140"></circle>
        </svg>
        <div class="ring-center">
          <div class="time" id="time">25:00</div>
          <div class="phase-sub" id="phaseSub">round 1 &middot; session 1 of 4</div>
        </div>
      </div>

      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>

    <div class="controls" id="controls">
      <button id="pauseBtn" class="ctrl" type="button" aria-label="Pause or resume">
        <svg viewBox="0 0 24 24" class="icon-pause" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
        <svg viewBox="0 0 24 24" class="icon-play hidden" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="skipBtn" class="ctrl" type="button" aria-label="Skip to next phase">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l8 6-8 6z"/><rect x="15.5" y="6" width="2.5" height="12" rx="1"/></svg>
      </button>
      <button id="endBtn" class="ctrl" type="button" aria-label="End session">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
    </div>
  </main>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
